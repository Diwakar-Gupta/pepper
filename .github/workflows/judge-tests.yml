name: Judge tests

on:
  push:
    paths: ["judge/**", ".github/workflows/judge-tests.yml"]
  pull_request:
    paths: ["judge/**"]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.8", "3.12"]
        exclude:
          - os: macos-latest
            python: "3.8"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest test_pepper_judge -v
        working-directory: judge
